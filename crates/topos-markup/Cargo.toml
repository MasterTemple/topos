[package]
name = "topos-bible-markup"
version = "0.6.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Bible markup (OSIS, ThML, GBF, TEI, USX) as one tree: plain text, HTML with classes, filters, and search"
readme = "README.md"
keywords = ["bible", "osis", "usx", "thml", "sword"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
topos-bible = { path = "../topos-lib", version = "0.6.0" }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"], optional = true }

[features]
## Serialize and Deserialize for the tree (Node, Element, Kind, Milestone, NodePath, VerseSpan),
## for caching parsed books
serde = ["dep:serde"]

[dev-dependencies]
# For tests/serde.rs only
serde_json = "1"
